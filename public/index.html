<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WarFarmer - Market Volume</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="any">
</head>
<body>
<h1>Warframe Market - 24h Trade Volume</h1>
<p><a href="missions.html">Mission types &rarr;</a></p>
<div id="status"></div>
<input id="search" placeholder="Search items..." autofocus>
<fieldset class="type-filter">
  <legend>Filter by type</legend>
  <div class="type-options">
    <label><input type="checkbox" value="mod"> Mods</label>
    <label><input type="checkbox" value="arcane"> Arcanes</label>
    <label><input type="checkbox" value="relic"> Relics</label>
    <label><input type="checkbox" value="weapon"> Weapons</label>
    <label><input type="checkbox" value="warframe"> Warframes</label>
    <label><input type="checkbox" value="component"> Components</label>
    <label><input type="checkbox" value="blueprint"> Blueprints</label>
    <label><input type="checkbox" value="set"> Sets</label>
    <label><input type="checkbox" value="resource"> Resources</label>
    <label><input type="checkbox" value="cosmetic"> Cosmetics</label>
    <label><input type="checkbox" value="other"> Other items</label>
  </div>
</fieldset>
<table>
  <thead><tr>
    <th>#</th><th>Item</th>
    <th class="num sortable" data-sort="volume">Volume (24h)</th>
    <th class="num sortable" data-sort="avg">Avg price (p, lowest rank)</th>
    <th class="num sortable" data-sort="maxAvg">Avg price (p, max rank)</th>
    <th class="num sortable" data-sort="rating" title="Market Rating (Experimental): Found by multiplying Trade volume by Trade price">MR(Beta)</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script src="config.js"></script>
<script src="index.js"></script>
</body>
</html>
