<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>WarFarmer - Market Volume</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="favicon.ico" sizes="any">
</head>
<body>
<h1>Warframe Market - 24h Trade Volume</h1>
<p><a href="missions.html">Mission types &rarr;</a></p>
<div id="status"></div>
<input id="search" placeholder="Search items..." title="Space-separated terms. -word excludes, /regex/ matches a pattern, &quot;quoted phrase&quot;. Example: arcane -/prime/" autofocus>
<fieldset class="type-filter">
  <legend>Filter by type</legend>
  <div class="type-options">
    <button type="button" class="type-btn" data-type="mod" data-state="off">Mods</button>
    <button type="button" class="type-btn" data-type="arcane" data-state="off">Arcanes</button>
    <button type="button" class="type-btn" data-type="relic" data-state="off">Relics</button>
    <button type="button" class="type-btn" data-type="weapon" data-state="off">Weapons</button>
    <button type="button" class="type-btn" data-type="warframe" data-state="off">Warframes</button>
    <button type="button" class="type-btn" data-type="component" data-state="off">Components</button>
    <button type="button" class="type-btn" data-type="blueprint" data-state="off">Blueprints</button>
    <button type="button" class="type-btn" data-type="set" data-state="off">Sets</button>
    <button type="button" class="type-btn" data-type="resource" data-state="off">Resources</button>
    <button type="button" class="type-btn" data-type="cosmetic" data-state="off">Cosmetics</button>
    <button type="button" class="type-btn" data-type="other" data-state="off">Other items</button>
  </div>
</fieldset>
<table>
  <thead><tr>
    <th>#</th><th>Item</th>
    <th class="num sortable" data-sort="volume">Volume (24h)</th>
    <th class="num sortable" data-sort="avg">Avg price (p, lowest rank)</th>
    <th class="num sortable" data-sort="maxAvg">Avg price (p, max rank)</th>
    <th class="num sortable" data-sort="rating" title="Market Rating (Experimental): Found by multiplying Trade volume by Trade price">MR(Beta)</th>
  </tr></thead>
  <tbody id="rows"></tbody>
</table>
<script src="config.js"></script>
<script src="index.js"></script>
</body>
</html>
